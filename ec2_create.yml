--- 
- hosts: localhost
  connection: local
  vars:
     ansible_python_interpreter: /home/mujab/ansible_ec2_prov/myenv/bin/python3
  
  tasks:
  - name: start an instance with a public IP address
    amazon.aws.ec2_instance:
      name: "{{ item.name }}"
      # key_name: "mujab_key_pair"
      instance_type: t3.micro
      security_group: default
      region: us-east-1
      aws_access_key: "{{ec2_access_key}}"  # From vault as defined
      aws_secret_key: "{{ec2_secret_key}}"  # From vault as defined      
      network:
        assign_public_ip: true
      image_id: "{{ item.image}}"

      tags:
        environment: "{{ item.name }}"

    loop:
      - { image: "ami-0152204c1a187337c", name: "manage-node-01"} 
      - { image: "ami-0b69ea66ff7391e80", name: "manage-node-02"}    
      - { image: "ami-0b69ea66ff7391e80", name: "manage-node-03"} 

   

      